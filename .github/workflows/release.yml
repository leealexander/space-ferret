name: release

# Push a tag like v0.2.0 to build and publish a release. The asset names are
# stable, so https://github.com/leealexander/space-ferret/releases/latest/download/<asset>
# always points at the newest build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: space-ferret.exe
            asset: space-ferret-windows-x86_64.exe
            run: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: space-ferret
            asset: space-ferret-linux-x86_64
            run: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            bin: space-ferret
            asset: space-ferret-linux-aarch64
            run: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Test
        if: matrix.run
        run: cargo test --release --locked

      # Linux targets link with rust-lld (see .cargo/config.toml): fully static, no C toolchain.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          "./out/${{ matrix.asset }}" --version
          "./out/${{ matrix.asset }}" --drives
          "./out/${{ matrix.asset }}" . -q --json > report.json
          grep -q '"tool": "space-ferret"' report.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Add skill and checksums
        run: |
          cp skill/space-ferret/SKILL.md dist/SKILL.md
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "space-ferret $TAG" --generate-notes
          fi
